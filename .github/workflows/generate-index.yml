name: Generate Index

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate index.json
        run: |
          python3 -c '
          import os, json, glob
          files = glob.glob("*.json")
          questions = []
          for f in sorted(files):
              if f in ["index.json", "latest.json", "master.json"]:
                  continue
              num_str = f.replace(".json", "")
              if num_str.isdigit():
                  qid = int(num_str)
                  url = f"https://raw.githubusercontent.com/mogawa0913-coder/kanji-puzzle/refs/heads/main/{f}"
                  questions.append({"id": qid, "title": f"第{qid}問", "url": url})
          questions.sort(key=lambda x: x["id"])
          with open("index.json", "w", encoding="utf-8") as out:
              json.dump(questions, out, ensure_ascii=False, indent=2)
          '
          
      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --staged --quiet || git commit -m "Auto-update index.json"
          git push
